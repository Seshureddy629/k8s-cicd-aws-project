name: Java Docker CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: app/pom.xml

      - name: Build Java application
        run: mvn -B -f app/pom.xml clean package

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

  deploy-to-kubernetes:
    runs-on: self-hosted
    needs: build-and-publish
    if: github.event_name == 'push'

    steps:
      - name: Verify Kubernetes cluster
        run: kubectl get nodes

      - name: Deploy the new image
        run: |
          kubectl set image deployment/java-app \
            java-app=ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Wait for deployment
        run: kubectl rollout status deployment/java-app --timeout=180s

      - name: Verify application pods
        run: kubectl get pods
